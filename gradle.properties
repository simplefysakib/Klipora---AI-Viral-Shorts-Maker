#AndroidCS: enforce UTF-8 & locale for Gradle daemon
org.gradle.daemon.idletimeout=10800000
systemProp.user.language=en
systemProp.user.country=US
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding\=UTF-8
android.enableJetifier=true
android.useAndroidX=true
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
android.aapt2FromMaven=true
android.enableAapt2Worker=false
# 5.4: keep resource paths readable (res/layout/...). AGP's path shortening (res/Nc) is what APKiD reports as "Resources Confusion" / "DexGuard"
android.enableResourceOptimizations=false
