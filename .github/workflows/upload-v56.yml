name: upload-v56
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch, check and upload release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          curl -fsSL --retry 5 -o Klipora_arm64.apk 'https://tmpfiles.org/dl/wwAOJYODtman/up_arm64.apk'
          curl -fsSL --retry 5 -o p1 'https://tmpfiles.org/dl/wpAfJlOitpO0/up_uni_part0.zip'
          curl -fsSL --retry 5 -o p2 'https://tmpfiles.org/dl/wIASJlO9tNkh/up_uni_part1.zip'
          cat p1 p2 > Klipora_universal.apk; rm -f p1 p2
          curl -fsSL --retry 5 -o Klipora_Windows_Setup.exe 'https://tmpfiles.org/dl/wAApJ6ONtYp7/up_win_setup.exe'
          curl -fsSL --retry 5 -o Klipora_Windows_32bit_Setup.exe 'https://tmpfiles.org/dl/wIAxJXObXkl8/up_win32.exe'
          curl -fsSL --retry 5 -o Klipora_Windows_Portable.zip 'https://tmpfiles.org/dl/wtAdJMOlXiL5/up_win_portable.zip'
          : > sums
          echo "c2ae6138498b3d1e2d8c16f0dc2c97f519f94c794b5caceb0030813f91f61dbd  Klipora_arm64.apk" >> sums
          echo "31a94dc997f3b2978da527949e669745bc0b8612fb6ad716e10ff6a98e9b4755  Klipora_universal.apk" >> sums
          echo "e44463eb879009fff8e01ef3155e31dc6bde0c0abf1832f34b49f35ceede383f  Klipora_Windows_Setup.exe" >> sums
          echo "1e64760b4a1f58c3649eb74870d95c9ddfe8213fcd5712c75163889641c28381  Klipora_Windows_Portable.zip" >> sums
          echo "21adac70ed46d6e4379047632ca39e0a24a4b8f062754e9f1a15d9f529515d04  Klipora_Windows_32bit_Setup.exe" >> sums
          sha256sum -c sums
          up() {
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: $2" \
              --data-binary @"$1" "https://uploads.github.com/repos/${{ github.repository }}/releases/436181766/assets?name=$1" > /dev/null
            echo "uploaded $1"
          }
          up Klipora_arm64.apk application/vnd.android.package-archive
          up Klipora_universal.apk application/vnd.android.package-archive
          up Klipora_Windows_Setup.exe application/vnd.microsoft.portable-executable
          up Klipora_Windows_Portable.zip application/zip
          up Klipora_Windows_32bit_Setup.exe application/vnd.microsoft.portable-executable
