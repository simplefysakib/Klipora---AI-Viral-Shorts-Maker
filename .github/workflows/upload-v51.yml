name: upload-v51
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch, check and upload release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          B=https://kl51-9632b3cdc3.sites.tab.bot
          get() {
            : > "$3"
            for i in $(seq 0 $(($2-1))); do p=$(printf '%s_%04d.bin' "$1" "$i"); curl -fsS --retry 5 -o "$p" "$B/$p"; cat "$p" >> "$3"; rm -f "$p"; done
          }
          get klipora_arm64 70 Klipora_arm64.apk
          get klipora_universal 140 Klipora_universal.apk
          get klipora_windows_setup 73 Klipora_Windows_Setup.exe
          get klipora_windows_portable 88 Klipora_Windows_Portable.zip
          get klipora_windows_32bit_setup 71 Klipora_Windows_32bit_Setup.exe
          : > sums
          echo "91d62255e5f876135b3fa2e2e0f134861cdd995b9dcc74296fde3d24824fdff9  Klipora_arm64.apk" >> sums
          echo "1c2e93e3c1a25a2e504c86b987a29ef1a416ddbddfbc57e86276bf37aebd4ae5  Klipora_universal.apk" >> sums
          echo "63ce564624290e0165f83aba8811529fa4692585499f77a6030a5c5b1e33406e  Klipora_Windows_Setup.exe" >> sums
          echo "afe6f318ab103fdfb384e9350fc6101767a5c22d060428dea9582698a677c8d1  Klipora_Windows_Portable.zip" >> sums
          echo "edb4fb34561eaab625c7b5e69db10ab061fa7f9369b229ebebfab2ffd06651a7  Klipora_Windows_32bit_Setup.exe" >> sums
          sha256sum -c sums
          up() {
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: $2" \
              --data-binary @"$1" "https://uploads.github.com/repos/${{ github.repository }}/releases/433148167/assets?name=$1" > /dev/null
            echo "uploaded $1"
          }
          up Klipora_arm64.apk application/vnd.android.package-archive
          up Klipora_universal.apk application/vnd.android.package-archive
          up Klipora_Windows_Setup.exe application/vnd.microsoft.portable-executable
          up Klipora_Windows_Portable.zip application/zip
          up Klipora_Windows_32bit_Setup.exe application/vnd.microsoft.portable-executable
