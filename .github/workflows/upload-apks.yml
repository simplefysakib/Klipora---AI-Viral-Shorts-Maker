name: upload-apks
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch, check and replace APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          curl -fsSL --retry 3 -X POST -o Klipora_4.5_universal.apk https://temp.sh/QIYNy/Klipora_4.5_universal.apk
          curl -fsSL --retry 3 -X POST -o Klipora_4.5_arm64.apk https://temp.sh/fbVsS/Klipora_4.5_arm64.apk
          echo "2b27a59d022d48a345599681513aa1e019f5f65673592a9b5bc3cfdb03ec8bbd  Klipora_4.5_universal.apk" > sums
          echo "dc71d0220d65512f4cb1d3a458fff54f67c58b78b06d5c4a7c202aadb438ddb0  Klipora_4.5_arm64.apk" >> sums
          sha256sum -c sums
          for id in 699276765 699276914; do
            curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/assets/$id"
            echo "deleted old asset $id"
          done
          for f in Klipora_4.5_universal.apk Klipora_4.5_arm64.apk; do
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @"$f" "https://uploads.github.com/repos/${{ github.repository }}/releases/430800161/assets?name=$f" > /dev/null
            echo "uploaded $f"
          done
