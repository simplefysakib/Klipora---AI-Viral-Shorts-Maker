name: upload-apks
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch, check and upload APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          curl -fsSL --retry 3 -X POST -o Klipora_4.5_universal.apk https://temp.sh/ORPZq/Klipora_4.5_universal.apk
          curl -fsSL --retry 3 -X POST -o Klipora_4.5_arm64.apk https://temp.sh/wjicO/Klipora_4.5_arm64.apk
          echo "cd2f7ea0e2b6ef7d0e628c715d2c21085f7e65a406831977adddfd6277178bb6  Klipora_4.5_universal.apk" > sums
          echo "da2c6b1ca7d4edd58bce88319f549282db370dd611014838f2646e96b2137e78  Klipora_4.5_arm64.apk" >> sums
          sha256sum -c sums
          for f in Klipora_4.5_universal.apk Klipora_4.5_arm64.apk; do
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @"$f" "https://uploads.github.com/repos/${{ github.repository }}/releases/430800161/assets?name=$f" > /dev/null
            echo "uploaded $f"
          done
