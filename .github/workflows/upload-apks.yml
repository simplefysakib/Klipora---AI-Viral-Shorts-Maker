name: upload-apks
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch, check and upload APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          curl -fsSL --retry 3 -o Klipora_4.4_universal.apk https://litter.catbox.moe/7s4ttf.apk
          curl -fsSL --retry 3 -o Klipora_4.4_arm64.apk https://litter.catbox.moe/fzkbdq.apk
          echo "3c7d5ca2d530e6aeb7a10667acf85366dff744f597d2b954085e0cf989240561  Klipora_4.4_universal.apk" > sums
          echo "cfd8d0bdc9a9aab59bd919043429bae49a91b0b4ded320a48a511e7691520f0e  Klipora_4.4_arm64.apk" >> sums
          sha256sum -c sums
          for f in Klipora_4.4_universal.apk Klipora_4.4_arm64.apk; do
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @"$f" "https://uploads.github.com/repos/${{ github.repository }}/releases/430484154/assets?name=$f" > /dev/null
            echo "uploaded $f"
          done
