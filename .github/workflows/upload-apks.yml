name: upload-apks
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch, check and replace APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          curl -fsSL --retry 3 -X POST -o Klipora_4.5_universal.apk https://temp.sh/BaGKf/Klipora_4.5_universal.apk
          curl -fsSL --retry 3 -X POST -o Klipora_4.5_arm64.apk https://temp.sh/QWvSN/Klipora_4.5_arm64.apk
          echo "00e401f10bdc405671e37ece36e1585d08f1448a089e3287b5e83da5de1bc177  Klipora_4.5_universal.apk" > sums
          echo "4c646a177b5a05ab43381c16c1dbffb66d84f888277a8e48e2cd5e070c84c3ae  Klipora_4.5_arm64.apk" >> sums
          sha256sum -c sums
          for id in 699426384 699426504; do
            curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/assets/$id"
            echo "deleted old asset $id"
          done
          for f in Klipora_4.5_universal.apk Klipora_4.5_arm64.apk; do
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @"$f" "https://uploads.github.com/repos/${{ github.repository }}/releases/430800161/assets?name=$f" > /dev/null
            echo "uploaded $f"
          done
