name: upload-apks
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch, check and upload APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          curl -fsSL --retry 3 -o Klipora_4.3_universal.apk https://litter.catbox.moe/munu6x.apk
          curl -fsSL --retry 3 -o Klipora_4.3_arm64.apk https://litter.catbox.moe/dwojqb.apk
          echo "6bfb36d419e2b87c1001e94835b93ba4f8f2193224e9513abbcccbbbf066a2ad  Klipora_4.3_universal.apk" > sums
          echo "5e9b030ae5f157d4a253eaac656e24dcb6721dd64404c196179f5bb2ae5ee7bb  Klipora_4.3_arm64.apk" >> sums
          sha256sum -c sums
          for f in Klipora_4.3_universal.apk Klipora_4.3_arm64.apk; do
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @"$f" "https://uploads.github.com/repos/${{ github.repository }}/releases/430398021/assets?name=$f" > /dev/null
            echo "uploaded $f"
          done
