name: upload-v49
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch, check and upload release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          get() {
            dl=$(curl -fsSL --retry 3 "$1" | grep -o 'https://tmpfiles.org/dl/[^"]*' | head -1)
            curl -fsSL --retry 3 -o "$2" "$dl"
          }
          get https://tmpfiles.org/wdARo3MGYkSP/klipora_v31_arm64.apk Klipora_arm64.apk
          get https://tmpfiles.org/wIAko1Mnum4X/uni_part1.zip u1
          get https://tmpfiles.org/woAIooMZuOpa/uni_part2.zip u2
          cat u1 u2 > Klipora_universal.apk
          get https://tmpfiles.org/wNAEo0Mruoth/klipora_windows_setup.exe Klipora_Windows_Setup.exe
          get https://tmpfiles.org/wOAHoCMtur9V/klipora_windows_portable.zip Klipora_Windows_Portable.zip
          get https://tmpfiles.org/w2AsoTMXuHrP/klipora_windows_32bit_setup.exe Klipora_Windows_32bit_Setup.exe
          echo "267dd5408553e3e61ee38f8eac539e5a3df0c045c9bdd4cb1b662f2fa81edb33  Klipora_universal.apk" > sums
          echo "8f57d62254f24fb25050ee843fc4c8026908ab5a31987cffd973a2a952f8e8a7  Klipora_arm64.apk" >> sums
          echo "d86f15b525ebda5075241a50031b070f52bfc6d7e9939659741cb92052d2c180  Klipora_Windows_Setup.exe" >> sums
          echo "da527c72b4ea8af25e2e9ed95ed9ffdeafcd481f920a74a4411ffadba33f901b  Klipora_Windows_Portable.zip" >> sums
          echo "c4e5226e9091db873b50d0b2988f07dd883a44ecd29c65a527a7049bf07f4e03  Klipora_Windows_32bit_Setup.exe" >> sums
          sha256sum -c sums
          up() {
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: $2" \
              --data-binary @"$1" "https://uploads.github.com/repos/${{ github.repository }}/releases/432463642/assets?name=$1" > /dev/null
            echo "uploaded $1"
          }
          up Klipora_arm64.apk application/vnd.android.package-archive
          up Klipora_universal.apk application/vnd.android.package-archive
          up Klipora_Windows_Setup.exe application/vnd.microsoft.portable-executable
          up Klipora_Windows_Portable.zip application/zip
          up Klipora_Windows_32bit_Setup.exe application/vnd.microsoft.portable-executable
